name: Tennis booking

on:
  schedule:
    # GitHub Actions cron is best-effort and can fire hours late, especially at
    # round minutes/hours. Three staggered triggers at odd minutes, well before
    # 08:00, so at least one lands early; the "Wait 08:00 Europe/Paris" step then
    # holds whichever run started first until 08:00 sharp. The concurrency group
    # (no cancel-in-progress) makes late duplicates harmless: they queue behind
    # the active run and find the slot already booked.
    - cron: '11 5 * * *'
      timezone: 'Europe/Paris'
    - cron: '23 6 * * *'
      timezone: 'Europe/Paris'
    - cron: '47 6 * * *'
      timezone: 'Europe/Paris'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    name: Run script at 08:00 Europe/Paris
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Create config.json from variables
        env:
          CONFIG_JSON: ${{ vars.CONFIG_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${CONFIG_JSON:-}" ]; then
            printf "%s" "$CONFIG_JSON" > config.json
            echo "config.json created from CONFIG_JSON variable"
          else
            echo "CONFIG_JSON variable not set; using config.json committed in the repository"
          fi

      - name: Install dependencies
        run: npm ci --production --ignore-scripts

      - name: Cache Playwright browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browser (only-shell)
        run: npx playwright install chromium --only-shell

      # Applies to scheduled AND dispatched runs (external triggers like
      # cron-job.org call workflow_dispatch): if started before 08:00 Paris,
      # hold until 08:00 sharp; if started after, continue immediately.
      - name: Wait 08:00 Europe/Paris
        run: npm run wait

      - name: Run script
        env:
          ACCOUNT_EMAIL: ${{ secrets.ACCOUNT_EMAIL }}
          ACCOUNT_PASSWORD: ${{ secrets.ACCOUNT_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_DOMAIN: ${{ secrets.NTFY_DOMAIN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: npm start
